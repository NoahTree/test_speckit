openapi: 3.0.3
info:
  title: Taskify Tasks API
  description: |
    REST API for managing tasks and comments in Taskify.

    Supports task CRUD, status updates (drag-and-drop), assignment, and comment management.
  version: 1.0.0
  contact:
    name: Taskify Development Team
    email: dev@taskify.local

servers:
  - url: http://localhost:5000/api
    description: Local development server
  - url: https://localhost:5001/api
    description: Local development server (HTTPS)

tags:
  - name: Tasks
    description: Task management endpoints
  - name: Comments
    description: Comment management endpoints

paths:
  /tasks/{taskId}:
    get:
      tags:
        - Tasks
      summary: Get task details
      description: Returns task details with all comments
      operationId: getTaskById
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CurrentUserId'
      responses:
        '200':
          description: Task details with comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailsDto'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Tasks
      summary: Update task
      description: |
        Updates task properties (title, description, status, assignee).
        Used for drag-and-drop status changes and reassignment.
      operationId: updateTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
            examples:
              statusChange:
                summary: Change status (drag-and-drop)
                value:
                  status: "In Progress"
              assignment:
                summary: Assign to user
                value:
                  assignedTo: "323e4567-e89b-12d3-a456-426614174001"
              fullUpdate:
                summary: Update all fields
                value:
                  title: "Updated task title"
                  description: "Updated description"
                  status: "In Review"
                  assignedTo: "323e4567-e89b-12d3-a456-426614174002"
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDto'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{taskId}/comments:
    get:
      tags:
        - Comments
      summary: Get task comments
      description: Returns all comments for a task in chronological order
      operationId: getTaskComments
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CurrentUserId'
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentDto'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Comments
      summary: Add comment to task
      description: Creates a new comment on the task
      operationId: createComment
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CurrentUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentDto'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /comments/{commentId}:
    patch:
      tags:
        - Comments
      summary: Update comment
      description: |
        Updates comment text. Only the comment author can edit.
        CreatedAt timestamp is preserved, UpdatedAt is updated.
      operationId: updateComment
      parameters:
        - $ref: '#/components/parameters/CommentId'
        - $ref: '#/components/parameters/CurrentUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentRequest'
      responses:
        '200':
          description: Comment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentDto'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - user is not the comment author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Comments
      summary: Delete comment
      description: |
        Deletes a comment. Only the comment author can delete.
      operationId: deleteComment
      parameters:
        - $ref: '#/components/parameters/CommentId'
        - $ref: '#/components/parameters/CurrentUserId'
      responses:
        '204':
          description: Comment deleted successfully
        '403':
          description: Forbidden - user is not the comment author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      description: Unique task identifier (UUID)
      schema:
        type: string
        format: uuid
      example: "223e4567-e89b-12d3-a456-426614174000"

    CommentId:
      name: commentId
      in: path
      required: true
      description: Unique comment identifier (UUID)
      schema:
        type: string
        format: uuid
      example: "423e4567-e89b-12d3-a456-426614174000"

    CurrentUserId:
      name: X-Current-User-Id
      in: header
      required: true
      description: |
        Current user ID for authorization checks.
        In initial phase (no auth), this is the selected user from user selection screen.
      schema:
        type: string
        format: uuid
      example: "323e4567-e89b-12d3-a456-426614174000"

  schemas:
    TaskDto:
      type: object
      required:
        - id
        - projectId
        - title
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique task identifier
        projectId:
          type: string
          format: uuid
          description: Parent project ID
        title:
          type: string
          minLength: 1
          maxLength: 500
          description: Task title
        description:
          type: string
          nullable: true
          maxLength: 5000
          description: Task description (optional)
        status:
          type: string
          enum: ["To Do", "In Progress", "In Review", "Done"]
          description: Current task status
        assignedTo:
          type: string
          format: uuid
          nullable: true
          description: Assigned user ID (null if unassigned)
        createdAt:
          type: string
          format: date-time
          description: Task creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp

    TaskDetailsDto:
      allOf:
        - $ref: '#/components/schemas/TaskDto'
        - type: object
          required:
            - projectName
            - comments
          properties:
            projectName:
              type: string
              description: Parent project name
              example: "Website Redesign"
            assigneeName:
              type: string
              nullable: true
              description: Assigned user name (null if unassigned)
              example: "Sarah Chen"
            comments:
              type: array
              description: All comments on this task (chronological order)
              items:
                $ref: '#/components/schemas/CommentDto'

    CommentDto:
      type: object
      required:
        - id
        - taskId
        - authorId
        - authorName
        - text
        - createdAt
        - updatedAt
        - canEdit
        - canDelete
      properties:
        id:
          type: string
          format: uuid
          description: Unique comment identifier
        taskId:
          type: string
          format: uuid
          description: Parent task ID
        authorId:
          type: string
          format: uuid
          description: Comment author user ID
        authorName:
          type: string
          description: Comment author name
          example: "Sarah Chen"
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: Comment text
        createdAt:
          type: string
          format: date-time
          description: Original creation timestamp (never changes)
        updatedAt:
          type: string
          format: date-time
          description: Last edit timestamp (changes on update)
        canEdit:
          type: boolean
          description: True if current user is the author (can edit)
        canDelete:
          type: boolean
          description: True if current user is the author (can delete)

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          nullable: true
          maxLength: 5000
        status:
          type: string
          enum: ["To Do", "In Progress", "In Review", "Done"]
        assignedTo:
          type: string
          format: uuid
          nullable: true
      minProperties: 1

    CreateCommentRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: Comment text

    UpdateCommentRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: Updated comment text

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
          example: "FORBIDDEN"
        message:
          type: string
          description: Human-readable error message
          example: "You cannot edit comments from other users"
        details:
          type: object
          nullable: true
          description: Additional error details
          additionalProperties: true
